<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Veb-sait - добавить вакансию</title>

    <link rel="stylesheet" href="index.css" />

    <script src="js/just-validate.min.js" defer></script>
    <script src="js/script.js" defer></script>
  </head>
  <body>
    <header class="header">
      <div class="container header__container">
        <a href="index.html">
          <img
            src="image/logo.svg"
            alt="Логотип Veb-sait"
            class="header__logo"
          />
        </a>
        <div class="header__links">
          <a href="index.html#vacancies" class="header__link"
            >Посмотреть вакансии</a
          >
        </div>
      </div>
    </header>
    <!-- БЛОК__ЭЛЕМЕНТ_МОДИФИКАТОР -->

    <main>
      <section class="employer">
        <div class="container">
          <h1 class="employer__title">Создай свою вакансию</h1>

          <form class="employer__form">
            <div class="employer__file file">
              <div class="file__wrap-preview">
                <img src="" class="file__preview" />
              </div>

              <div class="file__wrap-btn">
                <label for="logo" class="file__label">+ загрузить лого</label>
                <input
                  class="file__input"
                  type="file"
                  id="logo"
                  name="logo"
                  accept="image/png, image/jpeg"
                  required
                />
              </div>
            </div>

            <fieldset class="employer__fieldset employer__fieldset_input">
              <div class="employer__wrap-input">
                <label class="employer__label" for="company"
                  >Название компании</label
                >
                <input
                  class="employer__input"
                  type="text"
                  id="company"
                  name="company"
                  placeholder="Например: MICROSOFT"
                />
              </div>

              <div class="employer__wrap-input">
                <label class="employer__label" for="title"
                  >Название вакансии</label
                >
                <input
                  class="employer__input"
                  type="text"
                  id="title"
                  name="title"
                  placeholder="Например: Frontend-разработчик"
                />
              </div>

              <div class="employer__wrap-input">
                <label class="employer__label" for="salary"
                  >Заработная плата, руб/мес</label
                >
                <input
                  class="employer__input"
                  type="number"
                  id="salary"
                  name="salary"
                  placeholder="80 000"
                />
              </div>

              <div class="employer__wrap-input">
                <label class="employer__label" for="location">Город</label>
                <input
                  class="employer__input"
                  type="text"
                  id="location"
                  name="location"
                  placeholder="Например: Москва"
                />
              </div>

              <div class="employer__wrap-input">
                <label class="employer__label" for="email">E-mail</label>
                <input
                  class="employer__input"
                  type="email"
                  id="email"
                  name="email"
                  placeholder="Добавьте e-mail для связи"
                />
              </div>
            </fieldset>

            <fieldset class="employer__fieldset">
              <label class="employer__label" for="description"
                >Описание вакансии</label
              >
              <textarea
                class="employer__textarea"
                name="description"
                id="description"
                placeholder="Добавьте всю необходимую для соискателя информацию"
              ></textarea>
            </fieldset>

            <div class="employer__radio-buttons">
              <fieldset class="employer__fieldset-radio" id="format">
                <legend class="employer__legend">Формат</legend>

                <label class="employer__label-radio radio">
                  <input
                    class="radio__input"
                    type="radio"
                    name="format"
                    value="Офис"
                  />Офис
                </label>

                <label class="employer__label-radio radio">
                  <input
                    class="radio__input"
                    type="radio"
                    name="format"
                    value="Удаленный"
                  />Удаленный
                </label>

                <label class="employer__label-radio radio">
                  <input
                    class="radio__input"
                    type="radio"
                    name="format"
                    value="Гибкий"
                  />Гибкий
                </label>
              </fieldset>

              <fieldset class="employer__fieldset-radio" id="experience">
                <legend class="employer__legend">Опыт работы</legend>

                <label class="employer__label-radio radio">
                  <input
                    class="radio__input"
                    type="radio"
                    name="experience"
                    value="Не важно"
                  />Не важно
                </label>

                <label class="employer__label-radio radio">
                  <input
                    class="radio__input"
                    type="radio"
                    name="experience"
                    value="Без опыта"
                  />Без опыта
                </label>

                <label class="employer__label-radio radio">
                  <input
                    class="radio__input"
                    type="radio"
                    name="experience"
                    value="От 1 года до 3-х лет"
                  />От 1 года до 3-х лет
                </label>

                <label class="employer__label-radio radio">
                  <input
                    class="radio__input"
                    type="radio"
                    name="experience"
                    value="От 3-х лет"
                  />От 3-х лет
                </label>
              </fieldset>

              <fieldset class="employer__fieldset-radio" id="type">
                <legend class="employer__legend">Занятость</legend>

                <label class="employer__label-radio radio">
                  <input
                    class="radio__input"
                    type="radio"
                    name="type"
                    value="Полная"
                  />Полная
                </label>

                <label class="employer__label-radio radio">
                  <input
                    class="radio__input"
                    type="radio"
                    name="type"
                    value="Частичная"
                  />Частичная
                </label>

                <label class="employer__label-radio radio">
                  <input
                    class="radio__input"
                    type="radio"
                    name="type"
                    value="Стажировка"
                  />Стажировка
                </label>

                <label class="employer__label-radio radio">
                  <input
                    class="radio__input"
                    type="radio"
                    name="type"
                    value="Проектная работа"
                  />Проектная работа
                </label>
              </fieldset>
            </div>

            <div class="employer__wrap-submit">
              <button class="employer__submit" type="submit">
                Добавить вакансию
              </button>
              <div class="employer__error"></div>
            </div>
          </form>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container footer__container">
        <img
          src="image/logo-footer.svg"
          alt="Логотип Veb-sait"
          class="footer__logo"
        />

        <p class="footer__copyright">© Сайт центр карьеры, 2026</p>

        <ul class="footer__contacts">
          <li class="footer__contact">
            Designer:
            <a class="footer__link" href="#">Fedorov Mihail</a>
          </li>
          <li class="footer__contact">
            Developer:
            <a class="footer__link" href="#">Fedorov Mihail</a>
          </li>
        </ul>
      </div>
    </footer>
